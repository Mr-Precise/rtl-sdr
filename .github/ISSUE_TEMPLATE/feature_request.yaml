name: ✨ Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        What would you like to add or change? Describe what you want and why it would be useful.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the feature and why it would be useful
      placeholder: I would like to...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any examples, use cases, or references
