name: 🐞 Bug Report
description: Report a problem with rtl-sdr
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem clearly. What happened? What did you expect to happen instead?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide details about your setup
      placeholder: |
        - OS: 
        - rtl-sdr version / commit: 
        - Device (if known):
      render: markdown
  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Logs, screenshots, or anything else that might help
